name: Daily Surf Check

on:
  schedule:
    # Run at 8 AM Pacific Time (15:00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  check-conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify Node.js version
        run: |
          node --version
          npm --version
          which node
          echo "Node.js executable: $(which node)"
          echo "Node.js version: $(node --version)"
          echo "Expected: v20.x"

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Remove node_modules and package-lock.json
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install compatible axios version
        run: npm install axios@1.6.0 --save-exact

      - name: Update package.json for compatibility
        run: |
          npm pkg set engines.node=">=20.0.0"
          npm install --production=false

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SMTP_HOST }}" ]; then
            echo "Error: SMTP_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SMTP_PORT }}" ]; then
            echo "Error: SMTP_PORT secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SMTP_USER }}" ]; then
            echo "Error: SMTP_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SMTP_PASS }}" ]; then
            echo "Error: SMTP_PASS secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.NOTIFICATION_EMAIL }}" ]; then
            echo "Error: NOTIFICATION_EMAIL secret is not set"
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Check surf conditions
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          TARGET_BEACH: "Long-Beach_6"
          SURF_FORECAST_URL: "https://www.surf-forecast.com"
        run: |
          echo "Node.js version: $(node --version)"
          echo "NPM version: $(npm --version)"
          node src/utils/surfCheck.js 